# Multi-camera rooms. Each view is one camera agent.
# A view is either its own physical camera (`camera: <id>`) or, as in this demo, one lens of a
# multi-sensor unit derived from a source camera by `crop: [x, y, size]` in normalised source coords
# (square fraction keeps the source aspect ratio). Derived views share a clock, so agents can hand
# subjects to each other frame by frame.
# `pos` (metres, top-down plan), `yaw` (degrees, 0 = east, 90 = south) and `fov` only draw the floor plan.
rooms:
  tower-a-compound:
    name: Tower A equipment compound
    site: tower-a
    source_camera: cam-40739
    plan: {w: 12, h: 8, props: [{x: 3.2, y: 2.2, w: 2.6, h: 1.2, label: Cabinets}, {x: 6.6, y: 1.6, w: 1.3, h: 2.0, label: Shelter},
                                {x: 9.6, y: 1.0, w: 1.6, h: 1.6, label: Tower base}, {x: 0.3, y: 0.4, w: 0.25, h: 5.5, label: Fence}]}
    views:
      - {id: a-wide,    name: Mast camera,    crop: [0.00, 0.00, 1.00], pos: [6.0, 7.6], yaw: -90, fov: 92}
      - {id: a-gate,    name: Gate camera,    crop: [0.00, 0.18, 0.55], pos: [0.9, 6.6], yaw: -50, fov: 58}
      - {id: a-cabinet, name: Cabinet camera, crop: [0.42, 0.10, 0.55], pos: [11.2, 6.4], yaw: -135, fov: 58}
  hub-b-shelter:
    name: Hub B shelter and tower base
    site: hub-b
    source_camera: cam-4371
    plan: {w: 12, h: 8, props: [{x: 1.6, y: 1.0, w: 3.4, h: 2.4, label: Equipment shelter}, {x: 6.8, y: 3.4, w: 3.0, h: 3.0, label: Tower base},
                                {x: 5.6, y: 0.6, w: 1.2, h: 1.0, label: Cable tray}]}
    views:
      - {id: b-wide,    name: Overview camera,  crop: [0.00, 0.00, 1.00], pos: [6.0, 7.6], yaw: -90, fov: 92}
      - {id: b-shelter, name: Shelter camera,   crop: [0.15, 0.00, 0.55], pos: [0.8, 5.8], yaw: -60, fov: 58}
      - {id: b-base,    name: Tower base camera, crop: [0.30, 0.42, 0.58], pos: [11.2, 7.2], yaw: -150, fov: 60}
